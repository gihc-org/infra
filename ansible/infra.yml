---
# Installerer/opgraderer k3s på VPS'en og henter kubeconfig ned lokalt.
# Kør dette EFTER `tofu apply` er færdig. Re-kørbar: bump `k3s_version` i
# group_vars/all/vars.yml og kør playbooken igen for at opgradere clusteret.
#
# Brug:
#   ansible-playbook ansible/infra.yml -i ansible/inventory.yml

- name: Opsæt k3s platform
  hosts: gihc_vps

  tasks:
    # Hetzners egen resolver (sat via cloud-init i /etc/netplan/50-cloud-init.yaml)
    # viste sig at tage 20+ minutter om at fange en helt ny DNS-record, mens
    # offentlige resolvere (1.1.1.1, 8.8.8.8, 9.9.9.9) havde den med det samme.
    # Det blokerer cert-manager's HTTP-01 self-check for hver ny app/subdomæne.
    # Erstatter Hetzners nameservers med hurtigere offentlige resolvere.
    - name: Peg DNS-resolver på 1.1.1.1 i stedet for Hetzners egen
      ansible.builtin.replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '- 2a01:4ff:ff00::add:2'
        replace: "- 1.1.1.1"
      register: dns_resolver_1

    - name: Peg DNS-resolver på 8.8.8.8 i stedet for Hetzners egen
      ansible.builtin.replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '- 2a01:4ff:ff00::add:1'
        replace: "- 8.8.8.8"
      register: dns_resolver_2

    - name: Anvend netplan hvis DNS-resolveren blev ændret
      ansible.builtin.command: netplan apply
      when: dns_resolver_1.changed or dns_resolver_2.changed

    - name: Opret /etc/rancher/k3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Templat k3s config.yaml
      ansible.builtin.template:
        src: templates/k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"

    - name: Installer eller opgrader k3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -s -
      environment:
        INSTALL_K3S_VERSION: "{{ '' if k3s_version == 'latest' else k3s_version }}"

    - name: Vent på at k3s er klar
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300

    - name: Vent på at k3s API-server svarer
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 6443
        timeout: 300

    - name: Hent kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../kubeconfig.yml"
        flat: yes

    # kubeconfig.yml is left pointing at 127.0.0.1:6443 on purpose — the k3s
    # API is not exposed publicly (see tofu/main.tf's firewall). Reach it via
    # an SSH tunnel: `ssh -L 6443:localhost:6443 -N -f root@<server_ipv4>`.

    - name: Sæt korrekte rettigheder på kubeconfig
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../kubeconfig.yml"
        mode: "0600"
      delegate_to: localhost

    - name: Verificér at k3s kører
      ansible.builtin.command:
        cmd: k3s kubectl get nodes
      register: nodes_result
      changed_when: false
      retries: 10
      delay: 3
      until: "'Ready' in nodes_result.stdout"

    - name: Vis k3s nodes
      ansible.builtin.debug:
        msg: "{{ nodes_result.stdout_lines }}"
